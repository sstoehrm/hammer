<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>hammer canvas bench</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  #app { line-height: 0; }
  .grid { width: 800px; line-height: 0; }
  canvas { vertical-align: top; }
</style>
</head>
<body>
<div id="app"></div>
<script src="/common/data.js"></script>
<script>
  // ?src=<variant script>: /out/<build>/main.js (hammer) or /vanilla/<app>.js
  (function () {
    var src = new URLSearchParams(location.search).get('src') || '';
    if (src.charAt(0) !== '/') throw new Error('bench: bad src ' + src);
    var s = document.createElement('script');
    s.src = src;
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
