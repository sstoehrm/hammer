name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # renovate: datasource=java-version depName=java-jdk
  JAVA_VERSION: 25.0.4
  # renovate: datasource=node-version depName=node versioning=node
  NODE_VERSION: 24.21.0
  # renovate: datasource=github-tags depName=clojure/brew-install versioning=loose
  CLOJURE_CLI_VERSION: 1.12.6.1673
  # renovate: datasource=github-releases depName=babashka/babashka extractVersion=^v(?<version>.*)$
  BB_VERSION: 1.13.225

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Clojure CLI and babashka
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: ${{ env.CLOJURE_CLI_VERSION }}
          bb: ${{ env.BB_VERSION }}

      - name: Cache Maven and shadow-cljs deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ hashFiles('deps.edn', 'shadow-cljs.edn', 'bb.edn') }}

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Bundle sizes and variant isolation
        run: bb sizes

      - name: Release builds compile without warnings
        run: npx shadow-cljs release bench-canvas bench-dom bench-gl todomvc canvas-demo gl-demo

      - name: Release jar builds
        run: bb jar 0.0.0-ci
