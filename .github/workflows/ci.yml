name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Clojure CLI and babashka
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest
          bb: latest

      - name: Cache Maven and shadow-cljs deps
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ hashFiles('deps.edn', 'shadow-cljs.edn', 'bb.edn') }}

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Bundle sizes and variant isolation
        run: bb sizes

      - name: Release builds compile without warnings
        run: npx shadow-cljs release bench-canvas bench-dom bench-gl todomvc canvas-demo gl-demo

      - name: Release jar builds
        run: bb jar 0.0.0-ci
