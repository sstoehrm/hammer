name: Release

# Push a tag to release: git tag v0.1.0 && git push origin v0.1.0
# Creates a GitHub release with the jar attached, and deploys to Clojars when
# the repository secrets CLOJARS_USERNAME and CLOJARS_PASSWORD (a deploy token)
# are set. The deploy is Maven's (preinstalled on the runner); setup-java
# writes the credentials into ~/.m2/settings.xml as server "clojars".

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # build provenance for the jar (gh attestation verify)
  id-token: write
  attestations: write

env:
  # renovate: datasource=java-version depName=java-jdk extractVersion=^(?<version>\d+\.\d+\.\d+)
  JAVA_VERSION: 25.0.5
  # renovate: datasource=node-version depName=node
  NODE_VERSION: 24.22.1
  # renovate: datasource=github-tags depName=clojure/brew-install versioning=loose
  CLOJURE_CLI_VERSION: 1.12.6.1673
  # renovate: datasource=github-releases depName=babashka/babashka extractVersion=^v(?<version>.*)$
  BB_VERSION: 1.13.226
  # renovate: datasource=maven depName=org.apache.maven.plugins:maven-deploy-plugin
  MAVEN_DEPLOY_PLUGIN_VERSION: 3.2.0

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      # job level, so the deploy step's `if` can see whether they are set
      CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
      CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          server-id: clojars
          server-username: CLOJARS_USERNAME
          server-password: CLOJARS_PASSWORD

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Clojure CLI and babashka
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: ${{ env.CLOJURE_CLI_VERSION }}
          bb: ${{ env.BB_VERSION }}

      - name: Cache Maven and shadow-cljs deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ hashFiles('deps.edn', 'shadow-cljs.edn', 'bb.edn') }}

      - name: Tag is a version and the plugin version matches it
        run: bb release:check ${{ github.ref_name }}

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Build the jar
        run: bb jar ${{ github.ref_name }}

      - name: Attest the jar's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/hammer-*.jar

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          target/hammer-*.jar
          --title "hammer ${{ github.ref_name }}"
          --generate-notes

      - name: Deploy to Clojars
        if: env.CLOJARS_USERNAME != '' && env.CLOJARS_PASSWORD != ''
        run: |
          set -euo pipefail
          jar=(target/hammer-*.jar)
          mvn -B --no-transfer-progress \
            "org.apache.maven.plugins:maven-deploy-plugin:${MAVEN_DEPLOY_PLUGIN_VERSION}:deploy-file" \
            -Dfile="${jar[0]}" \
            -DpomFile=target/classes/META-INF/maven/io.github.sstoehrm/hammer/pom.xml \
            -DrepositoryId=clojars -Durl=https://clojars.org/repo
